<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>4fallU - Google Clone</title>
  </head>
  <body>
    <nav class="top-section">
      <div class="left-side">
        <a href="./pages/about.html">About</a>
        <a href="./pages/store.html">Store</a>
      </div>
      <div class="right-side">
        <a href="./pages/gmail.html">Gmail</a>
        <a href="./pages/images.html">Images</a>
        <img class="app-icon" src="./images/grid.png" alt="Apps" />
        <img class="pfp" src="./images/cat.jpeg" alt="Profile" />
      </div>
    </nav>

    <main class="middle-section">
      <div class="logo">
        <img
          class="logo-pic"
          src="https://glenat.landing-hachette.fr/wp-content/uploads/sites/35/2021/05/Logo-Shangri_La.png"
          alt="Logo"
        />
      </div>

      <form class="search-container">
        <div class="search-bar">
          <img class="search-icon" src="./images/search.png" alt="" />
          <input type="text" id="search-input" name="search" />
          <div class="search-icons-right">
            <img class="mic" src="./images/mic.png" alt="Voice Search" />
            <img
              class="camera"
              src="./images/camera.png"
              alt="Search by Image"
            />
          </div>
        </div>

        <div class="button-row">
          <button type="submit">Search</button>
          <button type="button">Unsa man</button>
        </div>
      </form>
    </main>

    <footer class="bottom-section">
      <div class="footer-group">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
      </div>
      <div class="footer-group">
        <a href="#">Boomba</a>
      </div>
      <div class="footer-group">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
    </footer>
  </body>
</html>
